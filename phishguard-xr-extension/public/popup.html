<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard-XR Protection Agent</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    .logo span { color: #3b82f6; }
    .status-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: #0f172a;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .tab-btn {
      flex: 1;
      padding: 6px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .metric-label { color: #94a3b8; }
    .metric-value { font-weight: 700; font-family: monospace; }
    textarea, input[type="text"] {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    textarea { height: 70px; resize: none; }
    .file-input-wrapper {
      margin-bottom: 8px;
    }
    input[type="file"] {
      font-size: 11px;
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      box-sizing: border-box;
    }
    .btn:hover { background: #1d4ed8; }
    .result-box {
      margin-top: 12px;
      display: none;
    }

    /* Cyber-Glassmorphic HUD Results UI */
    .result-card-v2 {
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.75) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .result-card-v2.threat {
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 12px 30px -5px rgba(239, 68, 68, 0.25), 0 0 15px -2px rgba(239, 68, 68, 0.2);
    }
    .result-card-v2.safe {
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 12px 30px -5px rgba(16, 185, 129, 0.25), 0 0 15px -2px rgba(16, 185, 129, 0.2);
    }
    .result-card-v2.caution {
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 12px 30px -5px rgba(245, 158, 11, 0.25);
    }
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(6px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .gauge-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }
    .gauge-svg-wrap {
      position: relative;
      width: 66px;
      height: 66px;
      flex-shrink: 0;
    }
    .gauge-score-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 800;
      font-family: monospace;
      font-size: 16px;
      text-align: center;
      line-height: 1;
    }
    .gauge-score-sub {
      font-size: 8px;
      opacity: 0.7;
      display: block;
      margin-top: 2px;
    }
    .verdict-info { flex: 1; }
    .verdict-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .verdict-badge.threat {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .verdict-badge.safe {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .verdict-badge.caution {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .target-url-box {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 10px;
      color: #93c5fd;
      word-break: break-all;
      margin-bottom: 8px;
    }
    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 8px;
    }
    .telemetry-pill {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 4px 6px;
    }
    .telemetry-pill-lbl {
      font-size: 8.5px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
    }
    .telemetry-pill-val {
      font-size: 10.5px;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .evidence-list-box {
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 10px;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .evidence-item {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      margin-bottom: 3px;
    }
    .evidence-item:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">PHISHGUARD<span>-XR</span></div>
    <div class="status-badge" id="protectionStatus">Active</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-web">🌐 Webpage</button>
    <button class="tab-btn" data-tab="tab-qr">📷 QR Code</button>
    <button class="tab-btn" data-tab="tab-sms">💬 SMS / Email</button>
  </div>

  <!-- TAB 1: WEBPAGE SCANNER -->
  <div class="tab-content active" id="tab-web">
    <div class="card">
      <div class="metric-row">
        <span class="metric-label">Active Domain:</span>
        <span class="metric-value" id="domainDisplay">Loading...</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Zero-PII Privacy:</span>
        <span class="metric-value" style="color: #10b981;">ENABLED</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Pre-Submit Guard:</span>
        <span class="metric-value" style="color: #10b981;">ARMED</span>
      </div>
    </div>
    <button class="btn" id="reScanBtn">Scan Current Page</button>
    <div id="webResultBox" class="result-box"></div>
  </div>

  <!-- TAB 2: QR CODE SCANNER -->
  <div class="tab-content" id="tab-qr">
    <div class="card">
      <div style="font-size: 11px; color: #94a3b8; margin-bottom: 8px;">Upload QR Code Image:</div>
      <div class="file-input-wrapper">
        <input type="file" id="qrFileInput" accept="image/*">
      </div>
      <div style="font-size: 10px; color: #64748b; margin: 6px 0; text-align: center;">— OR test specific URL —</div>
      <input type="text" id="qrDirectUrl" placeholder="Optional URL (e.g. https://google.com)">
      <button class="btn" id="scanQrBtn">Decode & Scan QR Code</button>
      <div id="qrResultBox" class="result-box"></div>
    </div>
  </div>

  <!-- TAB 3: SMS / EMAIL SCANNER -->
  <div class="tab-content" id="tab-sms">
    <div class="card">
      <div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">Paste SMS message or Email Content:</div>
      <textarea id="smsTextInput" placeholder="Paste SMS (e.g. 'URGENT: Your bank account is suspended. Verify at http://bank-verify.xyz')"></textarea>
      <button class="btn" id="scanSmsBtn">Analyze SMS / Email</button>
      <div id="smsResultBox" class="result-box"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
