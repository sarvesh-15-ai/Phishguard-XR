version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: phishguard_postgres
    environment:
      POSTGRES_DB: phishguard_db
      POSTGRES_USER: phish_admin
      POSTGRES_PASSWORD: secure_phishguard_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: phishguard_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./phishguard-xr-backend
      dockerfile: Dockerfile
    container_name: phishguard_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://phish_admin:secure_phishguard_password_2026@postgres:5432/phishguard_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
