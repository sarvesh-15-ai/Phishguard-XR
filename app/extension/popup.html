<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard-X</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-area">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span class="title">PHISHGUARD<span class="accent">-X</span></span>
      </div>
      <div class="status-badge" id="apiStatus">Disconnected</div>
    </div>

    <div class="main-content">
      <div class="url-display" id="currentUrl">Loading URL...</div>
      
      <button id="scanBtn" class="btn primary">Scan Current Page</button>
      
      <div id="loadingState" class="hidden">
        <div class="spinner"></div>
        <div class="loading-text">Executing Quad-Modal Analysis...</div>
      </div>

      <div id="resultState" class="hidden">
        <div class="result-card" id="resultCard">
          <div class="risk-circle" id="riskCircle">
            <span id="riskScore">--</span>
          </div>
          <div class="result-details">
            <div class="severity" id="severityTier">--</div>
            <div class="verdict" id="verdictText">--</div>
          </div>
        </div>
        
        <div class="report-box">
          <div class="report-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            AI Investigation Report
          </div>
          <div class="report-content" id="reportContent"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
